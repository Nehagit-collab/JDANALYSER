<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume & JD Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Vibrant Cosmic Palette */
            /* Vibrant Cosmic Palette */
            /* Vibrant Cosmic Palette */
            --gradient-bg: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #1e1b4b;
            --text-secondary: #475569;
            
            /* High Contrast Colors for the Output Analysis Text */
            --output-header: #4338ca;      /* Deep indigo for main sections */
            --output-bold: #b91c1c;        /* Crimson red for bold keywords/metrics */
            --output-text: #0f172a;        /* High-contrast charcoal for readability */
            --output-list-dot: #ec4899;    /* Bright pink for bullet points */
            
            --success-bg: #f8fafc;         /* Clean neutral light background for readability */
            --success-border: #a855f7;     /* Vibrant purple accent border */
            --error-color: #ef4444;
            --error-bg: #fef2f2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--gradient-bg);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #4338ca;
            font-size: 15px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 15px;
            background: #f8fafc;
            border: 2px dashed #c7d2fe;
            border-radius: 12px;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            background: #f5f3ff;
            border-color: #a855f7;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #ec4899 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }

        button:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-right: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- EXPLICIT COLOR STYLING FOR THE GENERATED OUTPUT TEXT --- */
        .result-container {
            margin-top: 35px;
            display: none;
            padding: 25px;
            background: var(--success-bg);
            border-radius: 14px;
            border-left: 6px solid var(--success-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .result-container h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        /* Removed white-space: pre-wrap; to prevent double-spacing with Marked.js */
        .analysis-text {
            font-size: 15px;
            color: var(--output-text);
            font-weight: 500;
        }

        /* Forces any Markdown/HTML headers generated inside to turn vibrant Indigo */
        .analysis-text h1, .analysis-text h2, .analysis-text h3, .analysis-text h4 {
            color: var(--output-header);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Forces any bolded words to catch the eye in dark crimson/red */
        .analysis-text strong, .analysis-text b {
            color: var(--output-bold);
            font-weight: 700;
            background: #fff5f5; /* light red highlight background badge */
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Style lists if your script outputs bullet points */
        .analysis-text ul {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .analysis-text li {
            margin-bottom: 6px;
        }

        .analysis-text li::marker {
            color: var(--output-list-dot); /* Custom pink bullets */
        }

        /* Tighten up paragraph margins for standard text blocks */
        .analysis-text p {
            margin-top: 6px;
            margin-bottom: 12px;
        }

        /* Alert Styling for Errors */
        .error-message {
            color: var(--error-color);
            background: var(--error-bg);
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            display: none;
            font-weight: 600;
            border-left: 6px solid var(--error-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Resume & JD Analyzer</h2>

        <form id="analyzeForm">
            <div class="form-group">
                <label for="resume">Upload Resume (PDF)</label>
                <input type="file" id="resume" name="resume" accept=".pdf" required>
            </div>

            <div class="form-group">
                <label for="jd">Upload Job Description (PDF)</label>
                <input type="file" id="jd" name="jd" accept=".pdf" required>
            </div>

            <button type="submit" id="submitBtn">Analyze Match</button>
        </form>

        <div class="spinner" id="loadingSpinner"></div>
        <div class="error-message" id="errorMessage">⚠ Something went wrong. Please try again.</div>

        <div class="result-container" id="resultContainer">
            <h3>Analysis Results</h3>
            
            <div id="matchScoreContainer" style="display: none; flex-direction: column; align-items: center; margin-bottom: 25px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: inset 0 0 10px rgba(0,0,0,0.02);">
                <span style="font-weight: 700; color: var(--text-color); margin-bottom: 8px; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase;">Overall Skill Alignment</span>
                <div style="position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;">
                    <svg style="transform: rotate(-90deg); width: 120px; height: 120px;">
                        <circle cx="60" cy="60" r="50" style="fill: transparent; stroke: #f1f5f9; stroke-width: 10;"></circle>
                        <circle id="scoreProgressRing" cx="60" cy="60" r="50" style="fill: transparent; stroke: #cbd5e1; stroke-width: 10; stroke-dasharray: 314; stroke-dashoffset: 314; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease-in-out, stroke 1.5s ease;"></circle>
                    </svg>
                    <div id="matchPercentageText" style="position: absolute; font-size: 26px; font-weight: 800; color: #4338ca;">0%</div>
                </div>
            </div>

            <div class="analysis-text" id="analysisOutput"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
